name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: "Y"
          MSSQL_SA_PASSWORD: "Rel10-CI-only-password!"
        ports:
          - 1433:1433
        options: >-
          --health-cmd="/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P Rel10-CI-only-password! -Q 'SELECT 1'"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      # SQL Server always encrypts the TDS login packet with its own self-signed
      # certificate, regardless of Encrypt. Without TrustServerCertificate=True the
      # SqlClient driver rejects that certificate's "localhost" name and fails with
      # "Cannot generate SSPI context" (its generic name for the TDS login handshake,
      # not actual Kerberos). Encrypt=False additionally skips encrypting the rest of
      # the session, which the ephemeral, disposable CI container doesn't need.
      ConnectionStrings__Relio: "Server=localhost,1433;Database=Relio;User Id=sa;Password=Rel10-CI-only-password!;Encrypt=False;TrustServerCertificate=True;"

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore

      - name: Restore tools
        run: dotnet tool restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Cache Playwright browsers
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('Relio.Web.E2ETests/Relio.Web.E2ETests.csproj') }}

      # Relio.Web.E2ETests (Relio.Web.E2ETests/Infrastructure/RelioAppFixture.cs) drives a real,
      # headless Chromium against the real app - it needs the matching browser build installed
      # (pwsh ships on ubuntu-latest runners; --with-deps also installs the OS libraries Chromium
      # needs that the runner image doesn't already have).
      - name: Install Playwright Chromium
        run: pwsh Relio.Web.E2ETests/bin/Release/net10.0/playwright.ps1 install --with-deps chromium

      - name: Test
        run: dotnet test --no-build --configuration Release --verbosity normal --collect:"XPlat Code Coverage"

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coverage
          path: '**/TestResults/**/coverage.cobertura.xml'
          if-no-files-found: error

      # RelioAppFixture.ClosePageAsync (Relio.Web.E2ETests/Infrastructure/RelioAppFixture.cs)
      # exports a Playwright trace (screenshots, DOM snapshots, actions) for every E2E test, not
      # just failing ones - cheap for this suite's size. Only uploaded when the job actually
      # fails, so a green run has no extra artifact to manage.
      - name: Upload Playwright traces
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-traces
          path: Relio.Web.E2ETests/bin/Release/net10.0/playwright-traces/
          if-no-files-found: ignore

      - name: Check for pending model changes
        run: >-
          dotnet ef migrations has-pending-model-changes
          --project Relio.Data --startup-project Relio.Web
          --no-build --configuration Release

      - name: Apply migrations to the CI database
        run: >-
          dotnet ef database update
          --project Relio.Data --startup-project Relio.Web
          --no-build --configuration Release

      - name: Validate Docker Compose
        run: MSSQL_SA_PASSWORD=TestPass123! RELIO_DP_PASSWORD=TestCertPass123! docker compose config

      - name: Build Docker image
        run: docker build -t relio:ci-test .
