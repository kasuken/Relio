# Read-only daily check that the hosted instance's backups are configured and fresh (REL-005).
# A failed run is the failure signal (GitHub notifies the watchers of this repository).
#
# Inactive until configured: the job is skipped unless the repository variable
# AZURE_BACKUP_MONITOR_CLIENT_ID is set (plus AZURE_TENANT_ID and AZURE_SUBSCRIPTION_ID). Create the
# read-only identity with infra/github-backup-monitor-identity.bicep. No secrets are used.
name: Hosted backup check

on:
  schedule:
    - cron: '41 5 * * *'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  check:
    name: Check Azure SQL and App Service backups
    if: ${{ vars.AZURE_BACKUP_MONITOR_CLIENT_ID != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      RESOURCE_GROUP: rg-relio-prod
      SQL_SERVER: sql-relio-prod-edff
      SQL_DATABASE: relio
      WEB_APP: app-relio-prod-edff
      EXPECTED_PITR_DAYS: '7'
      EXPECTED_LTR_WEEKLY: P4W
    steps:
      - name: Sign in (read-only identity)
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ vars.AZURE_BACKUP_MONITOR_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Check backup configuration and freshness
        shell: bash
        run: |
          set -uo pipefail
          failures=0
          warnings=0
          summary="${GITHUB_STEP_SUMMARY:-/dev/null}"
          {
            echo '## Hosted backup check'
            echo
            echo '| Check | Result | Detail |'
            echo '| --- | --- | --- |'
          } >>"$summary"

          report() { # name result detail
            echo "| $1 | $2 | $3 |" >>"$summary"
            case "$2" in
              FAIL) failures=$((failures + 1)); echo "::error::$1: $3" ;;
              WARN) warnings=$((warnings + 1)); echo "::warning::$1: $3" ;;
            esac
          }
          days_ago() { # ISO timestamp -> whole days old
            local then now
            then="$(date -u -d "$1" +%s 2>/dev/null)" || { echo 9999; return; }
            now="$(date -u +%s)"
            echo $(((now - then) / 86400))
          }

          pitr="$(az sql db str-policy show -g "$RESOURCE_GROUP" -s "$SQL_SERVER" -n "$SQL_DATABASE" --query retentionDays -o tsv 2>/dev/null)"
          if [[ "$pitr" == "$EXPECTED_PITR_DAYS" ]]; then report "Point-in-time retention" PASS "$pitr days"; else report "Point-in-time retention" FAIL "expected $EXPECTED_PITR_DAYS days, found '${pitr:-unreadable}'"; fi

          ltr="$(az sql db ltr-policy show -g "$RESOURCE_GROUP" -s "$SQL_SERVER" -n "$SQL_DATABASE" --query weeklyRetention -o tsv 2>/dev/null)"
          if [[ "$ltr" == "$EXPECTED_LTR_WEEKLY" ]]; then report "Long-term weekly retention" PASS "$ltr"; else report "Long-term weekly retention" FAIL "expected $EXPECTED_LTR_WEEKLY, found '${ltr:-unreadable}'"; fi

          tde="$(az sql db tde show -g "$RESOURCE_GROUP" -s "$SQL_SERVER" -d "$SQL_DATABASE" --query state -o tsv 2>/dev/null)"
          if [[ "$tde" == "Enabled" ]]; then report "Transparent data encryption" PASS "$tde"; else report "Transparent data encryption" FAIL "found '${tde:-unreadable}'"; fi

          earliest="$(az sql db show -g "$RESOURCE_GROUP" -s "$SQL_SERVER" -n "$SQL_DATABASE" --query earliestRestoreDate -o tsv 2>/dev/null)"
          if [[ -n "$earliest" ]] && (( $(days_ago "$earliest") <= 8 )); then report "Earliest restore point" PASS "$earliest"; else report "Earliest restore point" FAIL "'${earliest:-unreadable}' is missing or older than 8 days"; fi

          location="$(az sql server show -g "$RESOURCE_GROUP" -n "$SQL_SERVER" --query location -o tsv 2>/dev/null)"
          latest_ltr="$(az sql db ltr-backup list -l "$location" -g "$RESOURCE_GROUP" -s "$SQL_SERVER" -d "$SQL_DATABASE" --only-latest-per-database --query '[0].backupTime' -o tsv 2>/dev/null)"
          if [[ -n "$latest_ltr" ]] && (( $(days_ago "$latest_ltr") <= 8 )); then
            report "Latest long-term copy" PASS "$latest_ltr"
          else
            # The first copy can take up to a week to appear after the policy is enabled.
            report "Latest long-term copy" WARN "none in the last 8 days (expected within a week of enabling the policy)"
          fi

          snapshot="$(az webapp config snapshot list -g "$RESOURCE_GROUP" -n "$WEB_APP" --query 'sort_by(@, &time)[-1].time' -o tsv 2>/dev/null)"
          if [[ -n "$snapshot" ]] && (( $(days_ago "$snapshot") <= 1 )); then
            report "App Service backup (key ring and certificate)" PASS "$snapshot"
          else
            report "App Service backup (key ring and certificate)" WARN "no snapshot found in the last day (best effort; verify the automatic backup in the portal)"
          fi

          echo "failures=$failures warnings=$warnings"
          if (( failures > 0 )); then exit 1; fi
