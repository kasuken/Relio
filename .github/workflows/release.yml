# Production releases. Run this workflow on main to cut the next version, or publish a
# GitHub release. The steps live in kasuken/.github; see its RELEASING.md.
name: Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      bump:
        description: Version part to increment
        type: choice
        options: [patch, minor, major]
        default: patch
      redeploy:
        description: Existing tag to redeploy instead (rollback), e.g. v1.0.0
        type: string
        default: ''

concurrency:
  group: production
  cancel-in-progress: false

permissions:
  contents: write
  actions: read
  id-token: write
  packages: write

jobs:
  release:
    uses: kasuken/.github/.github/workflows/release-azure-webapp.yml@main
    with:
      app-name: relio-prod-001
      web-project: Relio.Web/Relio.Web.csproj
      base-url: https://relio-prod-001.azurewebsites.net
      migrations-project: Relio.Data/Relio.Data.csproj
      migrations-connection-variable: ConnectionStrings__Relio
      resource-group: Relio.Prod
      sql-server: relio-prod-001-server
      sql-database: relio-prod-001-database
      health-path: /health/ready
      smoke-paths: /Account/Login /pricing
      bump: ${{ inputs.bump || 'patch' }}
      redeploy: ${{ inputs.redeploy || '' }}
    secrets: inherit

  docker:
    name: Publish Docker image to GHCR
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@b5ca514318bd6ebac0fb2aedd5d36ec1b5c232a2 # v3.10.0

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@9780b0c442fbb1117ed29e0efdff1e18412f7567 # v3.3.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@902fa8ec7d6ecbf8d84d538b9b233a880e428804 # v5.7.0
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest
            type=ref,event=tag

      - name: Build and push Docker image
        uses: docker/build-push-action@471d1dc4e07e5cdedd4c2171150001c434f0b7a4 # v6.15.0
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
